<div class="tabs-bar">
  <div class="tabs-list" role="tablist" aria-label="Ordenar biblioteca">
    <button type="button" class="tab-btn" [class.active]="selectedSort() === 'recent'" (click)="selectSort('recent')">
      Recientes
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedSort() === 'title'" (click)="selectSort('title')">
      A–Z
    </button>
    <button type="button" class="tab-btn" [class.active]="selectedSort() === 'duration'" (click)="selectSort('duration')">
      Duración
    </button>
  </div>

  <div class="inline-filter">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
    </svg>
    <input
      type="search"
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchInput($event)"
      placeholder="Filtrar..."
      aria-label="Filtrar biblioteca" />
  </div>
</div>
