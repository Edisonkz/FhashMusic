<article class="song-card" [class.is-active]="isCurrent()" appHighlightOnHover>
  <div class="thumb-wrap" (click)="preview()">
    @if (song().thumbnail) {
      <img [src]="song().thumbnail" [alt]="song().title" class="thumb-img" loading="lazy" />
    } @else {
      <div class="thumb-fallback" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
        </svg>
      </div>
    }

    <div class="thumb-scrim"></div>

    @if (song().genre) {
      <span class="genre-tag">{{ song().genre }}</span>
    }

    <span class="duration-pill">{{ song().duration | duration }}</span>

    <button
      type="button"
      class="play-fab"
      (click)="$event.stopPropagation(); preview()"
      [attr.aria-label]="isPlaying() ? 'Pausar ' + song().title : 'Reproducir ' + song().title">
      @if (isPlaying()) {
        <span class="eq-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M8 5.14v14l11-7-11-7z" />
        </svg>
      }
    </button>
  </div>

  <div class="card-body">
    <div class="card-head">
      <div class="card-meta">
        <h3 class="song-title" [title]="song().title">{{ song().title }}</h3>
        <p class="song-artist" [title]="song().uploader">{{ song().uploader }}</p>
      </div>
      <button
        type="button"
        class="fav-btn"
        [class.saved]="isSaved()"
        (click)="toggleLibrary()"
        [attr.aria-label]="isSaved() ? 'Quitar de Mi Biblioteca' : 'Guardar en Mi Biblioteca'">
        <svg viewBox="0 0 24 24" width="17" height="17" [attr.fill]="isSaved() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        </svg>
      </button>
    </div>

    <div class="card-actions">
      <button type="button" class="dl-btn dl-mp3" (click)="download('mp3')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        MP3
      </button>
      <button type="button" class="dl-btn dl-mp4" (click)="download('mp4')">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="2" y="4" width="20" height="16" rx="2" /><polygon points="10 9 15 12 10 15 10 9" />
        </svg>
        MP4
      </button>
    </div>
  </div>
</article>
