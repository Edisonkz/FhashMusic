@if (player.currentTrack(); as track) {
  <aside class="player-dock" aria-label="Reproductor de audio">
    <!-- Top Sleek Progress Bar -->
    <div class="top-seek">
      <span class="time-code">{{ player.currentTime() | duration }}</span>
      <input
        type="range"
        class="range-slider"
        min="0"
        [max]="player.duration() || 100"
        [value]="player.currentTime()"
        [style.--fill.%]="player.progressPercent()"
        (input)="onSeek($event)"
        aria-label="Progreso de reproducción" />
      <span class="time-code">{{ player.duration() | duration }}</span>
    </div>

    <div class="player-row">
      <!-- Left: Artwork & Info -->
      <div class="player-meta">
        <div class="player-thumb">
          @if (track.thumbnail) {
            <img [src]="track.thumbnail" [alt]="track.title" />
          } @else {
            <span>♪</span>
          }
        </div>
        <div class="player-text">
          <span class="player-title" [title]="track.title">{{ track.title }}</span>
          <span class="player-artist">{{ track.uploader }}</span>
        </div>
      </div>

      <!-- Center: 5 Controls with Glowing Orange Play/Pause -->
      <div class="player-controls">
        <button
          type="button"
          class="ctrl-btn"
          [class.active]="player.isShuffle()"
          (click)="player.toggleShuffle()"
          aria-label="Aleatorio">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8" /><line x1="4" y1="20" x2="21" y2="3" />
            <polyline points="21 16 21 21 16 21" /><line x1="15" y1="15" x2="21" y2="21" /><line x1="4" y1="4" x2="9" y2="9" />
          </svg>
        </button>

        <button
          type="button"
          class="ctrl-btn"
          [disabled]="!player.hasPrevious()"
          (click)="player.previous()"
          aria-label="Anterior">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>

        <button
          type="button"
          class="play-btn"
          (click)="player.togglePlay()"
          [attr.aria-label]="player.isPlaying() ? 'Pausar' : 'Reproducir'">
          @if (player.isPlaying()) {
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
              <rect x="6" y="5" width="4" height="14" rx="1" />
              <rect x="14" y="5" width="4" height="14" rx="1" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
              <path d="M8 5.14v14l11-7-11-7z" />
            </svg>
          }
        </button>

        <button
          type="button"
          class="ctrl-btn"
          [disabled]="!player.hasNext()"
          (click)="player.next()"
          aria-label="Siguiente">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>

        <button
          type="button"
          class="ctrl-btn"
          [class.active]="player.isRepeat()"
          (click)="player.toggleRepeat()"
          aria-label="Repetir">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 0 1 4-4h14" />
            <polyline points="7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 0 1-4 4H3" />
          </svg>
        </button>
      </div>

      <!-- Right: Download, Favorite, Volume, Close -->
      <div class="player-right">
        <button
          type="button"
          class="ctrl-btn hide-sm"
          (click)="downloads.startDownload(track, 'mp3')"
          aria-label="Descargar MP3">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
          </svg>
        </button>

        <button
          type="button"
          class="ctrl-btn fav-ctrl"
          [class.saved]="library.isSaved(track.id)"
          (click)="library.toggleLibrary(track)"
          [attr.aria-label]="library.isSaved(track.id) ? 'Quitar de favoritos' : 'Guardar en favoritos'">
          <svg viewBox="0 0 24 24" width="16" height="16" [attr.fill]="library.isSaved(track.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
          </svg>
        </button>

        <div class="volume-wrap">
          <button
            type="button"
            class="ctrl-btn"
            (click)="player.toggleMute()"
            [attr.aria-label]="player.isMuted() ? 'Activar sonido' : 'Silenciar'">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              @if (player.isMuted() || player.volume() === 0) {
                <line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" />
              } @else {
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              }
            </svg>
          </button>
          <input
            type="range"
            class="range-slider volume-slider"
            min="0"
            max="1"
            step="0.02"
            [value]="player.isMuted() ? 0 : player.volume()"
            [style.--fill.%]="(player.isMuted() ? 0 : player.volume()) * 100"
            (input)="onVolumeChange($event)"
            aria-label="Volumen" />
        </div>

        <button type="button" class="ctrl-btn" (click)="player.close()" aria-label="Cerrar reproductor">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>
  </aside>
}
